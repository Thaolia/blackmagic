# Cross-file for ST-Link v2 clones with a 64 KiB STM32F103C8: no bootloader, linked at 0x08000000, UART on SWIM/nRST pins.
# LTO is enabled to make cortexm,nrf,rp,bat32,stm32f1 fit in 64 KiB (-ffat-lto-objects is added automatically, see meson.build).

[built-in options]
b_lto = true

[binaries]
c = 'arm-none-eabi-gcc'
cpp = 'arm-none-eabi-g++'
ld = 'arm-none-eabi-gcc'
ar = 'arm-none-eabi-ar'
nm = 'arm-none-eabi-nm'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'
objdump = 'arm-none-eabi-objdump'
size = 'arm-none-eabi-size'

[host_machine]
system = 'bare-metal'
cpu_family = 'arm'
cpu = 'arm'
endian = 'little'

[project options]
probe = 'stlink'
targets = 'cortexm,nrf,rp,bat32,stm32f1'
rtt_support = false
stlink_swim_nrst_as_uart = true
bmd_bootloader = false
stlink_v2_isol = false
stlink_standalone = true
stlink_flash_size = '64'
